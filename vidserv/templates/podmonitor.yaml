apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "vidserv.fullname" . }}
  labels:
    {{- include "vidserv.labels" . | nindent 4 }}
    release: {{ .Values.prometheus.release }}
spec:
  selector:
    matchLabels:
      {{- include "vidserv.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
  - port: prom-metrics
    path: /metrics
    interval: {{ .Values.prometheus.scrapeInterval }}
